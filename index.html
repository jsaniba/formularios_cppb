<!DOCTYPE html>
<html lang="ca">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sol·licituds</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: #e5e5e5;
    color: #111;
    font-family: Arial, sans-serif;
}

.contenidor {
    width: 900px;
    max-width: 95%;
    margin: 40px auto;
    padding: 30px;
    background: white;
    box-shadow: 0 0 8px rgba(0,0,0,0.25);
}

.logo {
    width: 70mm;
    height: auto;
    display: block;
    margin-bottom: 30px;
}

.titol {
    font-size: 22px;
    font-weight: bold;
    text-align: left;
    margin-bottom: 40px;
    line-height: 1.3;
}

.botons {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.botons button {
    width: 100%;
    padding: 18px 20px;
    border: 1px solid #555;
    background: #f5f5f5;
    color: #111;
    border-radius: 5px;
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-size: 18px;
    font-weight: bold;
}

.botons button:hover {
    background: #e5e5e5;
}

@media (max-width: 600px) {
    .contenidor {
        margin: 20px auto;
        padding: 20px;
    }

    .logo {
        width: 60mm;
        max-width: 100%;
    }

    .titol {
        font-size: 18px;
    }

    .botons button {
        font-size: 16px;
        padding: 16px;
    }
}
</style>
</head>

<body>

<div class="contenidor">

    <img src="logo.png" class="logo" alt="Logo">

    <div class="titol">
        SOL·LICITUDS VACANÇES I A/P, CANVIS DE SERVEI
        I ACUMULACIÓ DE JORNADA
    </div>

    <div class="botons">

        <button type="button"
            onclick="window.location.href='vacaciones.html'">
            VACANÇES I A/P
        </button>

        <button type="button"
            onclick="window.location.href='form1.html'">
            CANVIS DE SERVEI
        </button>

        <button type="button"
            onclick="window.location.href='Acumulació.html'">
            ACUMULACIÓ DE JORNADA
        </button>

    </div>

</div>

</body>
</html>
